  <path d="M 12 48 C 12 20, 52 20, 52 48" fill="none" stroke="url(#favBlue)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonGlowBlue)" />
  <path d="M 12 48 C 12 20, 52 20, 52 48" fill="none" stroke="#e0f2fe" stroke-width="0.75" opacity="0.9" />

  <circle cx="32" cy="12" r="3.5" fill="#0f1115" stroke="url(#favBlue)" stroke-width="1.5" />
  
  <circle cx="16" cy="28" r="3" fill="#0f1115" stroke="#ef4444" stroke-width="1.5" />

